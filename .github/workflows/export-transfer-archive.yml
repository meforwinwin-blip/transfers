name: Export encrypted transfer archive
on:
  push:
    paths:
      - '.github/workflows/export-transfer-archive.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload encrypted archive unchanged
        uses: actions/upload-artifact@v4
        with:
          name: goproclient-transfer
          path: GoProClient-73e40d8.7z
          if-no-files-found: error
          retention-days: 1
